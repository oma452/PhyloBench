[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phylo-bench"
version = "0.1.0"
description = "Reproducible benchmarking and visualization for gene tree-species tree reconciliation."
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.81",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
