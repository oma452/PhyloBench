[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phylo-bench"
version = "0.1.0"
description = "Reproducible benchmarking and visualization for gene tree-species tree reconciliation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.81",
    "matplotlib>=3.7",
]

[project.scripts]
phylo-bench = "phylo_bench.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
quality = [
    "mypy>=1.11",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
